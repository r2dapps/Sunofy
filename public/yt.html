<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0" />
  <title>Sunofy YT — YouTube Music & Video</title>
  <meta name="description" content="Search and play YouTube Music and Videos instantly." />
  <meta name="theme-color" content="#0a0a0f" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet" />
  <style>
    :root {
      --bg: #0a0a0f;
      --surface: #111118;
      --card: #17171f;
      --border: #2a2a38;
      --text: #f0f0f8;
      --muted: #888;
      --accent: #a855f7;
      --accent2: #6366f1;
      --red: #ef4444;
      --green: #22c55e;
    }
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { height: 100%; background: var(--bg); color: var(--text); font-family: 'Inter', sans-serif; overflow-x: hidden; }
    body { display: flex; flex-direction: column; }

    /* ─── Scrollbar ─── */
    ::-webkit-scrollbar { width: 4px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb { background: var(--border); border-radius: 4px; }

    /* ─── Header ─── */
    header {
      position: sticky; top: 0; z-index: 50;
      background: rgba(10,10,15,0.9); backdrop-filter: blur(20px);
      border-bottom: 1px solid var(--border);
      padding: 12px 16px;
    }
    .header-inner {
      max-width: 800px; margin: 0 auto;
      display: flex; align-items: center; gap: 12px;
    }
    .logo {
      font-size: 18px; font-weight: 900;
      background: linear-gradient(135deg, var(--accent), var(--accent2));
      -webkit-background-clip: text; -webkit-text-fill-color: transparent;
      white-space: nowrap; flex-shrink: 0;
    }
    .logo span { font-size: 10px; font-weight: 600; color: var(--muted); -webkit-text-fill-color: var(--muted); display: block; letter-spacing: 0.1em; }

    /* Mode tabs */
    .mode-tabs {
      display: flex; gap: 4px; padding: 3px;
      background: var(--card); border: 1px solid var(--border);
      border-radius: 10px; flex-shrink: 0;
    }
    .mode-tab {
      padding: 5px 12px; border-radius: 8px; border: none;
      cursor: pointer; font-size: 11px; font-weight: 700; font-family: inherit;
      color: var(--muted); background: transparent; transition: all .2s;
    }
    .mode-tab.active { background: var(--accent); color: #fff; }

    /* Search bar */
    .search-wrap { flex: 1; position: relative; }
    .search-wrap input {
      width: 100%; padding: 9px 40px 9px 14px;
      background: var(--card); border: 1px solid var(--border);
      border-radius: 12px; color: var(--text); font-size: 13px; font-family: inherit;
      outline: none; transition: border .2s;
    }
    .search-wrap input:focus { border-color: var(--accent); }
    .search-wrap input::placeholder { color: var(--muted); }
    .search-wrap button {
      position: absolute; right: 8px; top: 50%; transform: translateY(-50%);
      background: none; border: none; color: var(--accent); cursor: pointer; display: flex;
    }

    /* ─── Main ─── */
    main { flex: 1; overflow-y: auto; padding-bottom: 160px; }
    .container { max-width: 800px; margin: 0 auto; padding: 16px; }

    /* ─── Results grid ─── */
    .results-title {
      font-size: 12px; font-weight: 700; color: var(--muted);
      text-transform: uppercase; letter-spacing: .08em; margin-bottom: 12px;
    }
    .grid {
      display: grid; gap: 12px;
      grid-template-columns: repeat(auto-fill, minmax(160px, 1fr));
    }
    .grid.list { grid-template-columns: 1fr; }

    .card {
      background: var(--card); border: 1px solid var(--border);
      border-radius: 16px; overflow: hidden;
      cursor: pointer; transition: border-color .2s, transform .15s;
    }
    .card:hover { border-color: var(--accent); transform: translateY(-2px); }
    .card:active { transform: scale(0.98); }
    .thumb-wrap { position: relative; aspect-ratio: 16/9; overflow: hidden; }
    .thumb-wrap img { width: 100%; height: 100%; object-fit: cover; display: block; }
    .thumb-wrap .dur {
      position: absolute; bottom: 5px; right: 5px;
      background: rgba(0,0,0,.85); color: #fff; font-size: 10px; font-weight: 700;
      padding: 1px 5px; border-radius: 4px;
    }
    .thumb-wrap .play-btn {
      position: absolute; inset: 0; display: flex; align-items: center; justify-content: center;
      background: rgba(0,0,0,.45); opacity: 0; transition: opacity .2s;
    }
    .card:hover .play-btn { opacity: 1; }
    .play-btn svg { filter: drop-shadow(0 2px 8px rgba(0,0,0,.8)); }
    .card-info { padding: 10px; }
    .card-title { font-size: 12px; font-weight: 700; color: var(--text); line-height: 1.35; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
    .card-artist { font-size: 11px; color: var(--muted); margin-top: 3px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

    /* List card */
    .list-card {
      display: flex; align-items: center; gap: 12px;
      background: var(--card); border: 1px solid var(--border);
      border-radius: 14px; padding: 10px; cursor: pointer;
      transition: border-color .2s, background .15s;
    }
    .list-card:hover { border-color: var(--accent); background: var(--surface); }
    .list-card:active { transform: scale(0.99); }
    .list-thumb { width: 56px; height: 56px; border-radius: 10px; object-fit: cover; flex-shrink: 0; }
    .list-info { flex: 1; min-width: 0; }
    .list-title { font-size: 13px; font-weight: 700; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .list-artist { font-size: 11px; color: var(--muted); margin-top: 2px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .list-dur { font-size: 11px; color: var(--muted); flex-shrink: 0; }
    .list-card .add-q {
      background: none; border: 1px solid var(--border); color: var(--muted);
      border-radius: 8px; padding: 4px 8px; font-size: 10px; font-weight: 700;
      cursor: pointer; font-family: inherit; transition: all .15s; flex-shrink: 0;
    }
    .list-card .add-q:hover { border-color: var(--accent); color: var(--accent); }

    /* ─── Empty / Loading / Error ─── */
    .empty { text-align: center; padding: 60px 20px; color: var(--muted); }
    .empty svg { margin: 0 auto 16px; opacity: .3; display: block; }
    .empty h3 { font-size: 16px; font-weight: 700; color: var(--text); margin-bottom: 6px; }
    .empty p { font-size: 13px; }
    .spinner {
      width: 28px; height: 28px; margin: 60px auto;
      border: 3px solid var(--border); border-top-color: var(--accent);
      border-radius: 50%; animation: spin .8s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    /* ─── Player Bar ─── */
    #player-bar {
      position: fixed; bottom: 0; left: 0; right: 0; z-index: 100;
      background: rgba(10,10,15,0.97); backdrop-filter: blur(24px);
      border-top: 1px solid var(--border);
      padding: 0; transition: transform .35s cubic-bezier(.4,0,.2,1);
      transform: translateY(100%);
    }
    #player-bar.visible { transform: translateY(0); }

    /* Video panel (collapsible) */
    #video-panel {
      width: 100%; max-height: 0; overflow: hidden;
      transition: max-height .35s ease;
      background: #000;
    }
    #video-panel.open { max-height: min(56.25vw, 380px); }
    #video-panel iframe { width: 100%; height: min(56.25vw, 380px); border: none; display: block; }

    .player-inner {
      max-width: 800px; margin: 0 auto;
      display: flex; align-items: center; gap: 12px;
      padding: 10px 16px;
    }
    .now-thumb { width: 44px; height: 44px; border-radius: 10px; object-fit: cover; flex-shrink: 0; cursor: pointer; }
    .now-info { flex: 1; min-width: 0; cursor: pointer; }
    .now-title { font-size: 13px; font-weight: 700; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .now-artist { font-size: 11px; color: var(--muted); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .player-controls { display: flex; align-items: center; gap: 4px; flex-shrink: 0; }
    .ctrl-btn {
      background: none; border: none; color: var(--text); cursor: pointer;
      display: flex; align-items: center; justify-content: center;
      width: 36px; height: 36px; border-radius: 50%; transition: background .15s;
    }
    .ctrl-btn:hover { background: rgba(168,85,247,.15); }
    .ctrl-btn.play-pause {
      background: var(--accent); color: #fff; width: 40px; height: 40px;
    }
    .ctrl-btn.play-pause:hover { background: #9333ea; }
    .progress-wrap {
      padding: 4px 16px 0; max-width: 800px; margin: 0 auto;
    }
    .progress-bar {
      -webkit-appearance: none; appearance: none;
      width: 100%; height: 3px; border-radius: 3px; outline: none; cursor: pointer;
      background: linear-gradient(to right, var(--accent) 0%, var(--border) 0%);
    }
    .progress-bar::-webkit-slider-thumb {
      -webkit-appearance: none; width: 12px; height: 12px;
      background: var(--accent); border-radius: 50%; cursor: pointer;
    }
    .time-row {
      display: flex; justify-content: space-between;
      font-size: 10px; color: var(--muted); padding: 2px 16px 6px;
      max-width: 800px; margin: 0 auto;
    }

    /* Volume */
    #vol-wrap { display: flex; align-items: center; gap: 6px; flex-shrink: 0; }
    #vol-wrap input[type=range] {
      -webkit-appearance: none; width: 60px; height: 3px;
      background: var(--border); border-radius: 3px; outline: none; cursor: pointer;
    }
    #vol-wrap input[type=range]::-webkit-slider-thumb {
      -webkit-appearance: none; width: 10px; height: 10px;
      background: var(--accent); border-radius: 50%;
    }

    /* Queue sidebar */
    #queue-panel {
      position: fixed; right: 0; top: 0; bottom: 0; width: min(320px, 100vw);
      background: var(--surface); border-left: 1px solid var(--border);
      z-index: 200; transform: translateX(100%); transition: transform .3s;
      display: flex; flex-direction: column;
    }
    #queue-panel.open { transform: translateX(0); }
    .queue-header {
      display: flex; align-items: center; justify-content: space-between;
      padding: 16px; border-bottom: 1px solid var(--border);
    }
    .queue-header h2 { font-size: 14px; font-weight: 800; }
    .queue-close { background: none; border: none; color: var(--muted); cursor: pointer; display: flex; }
    .queue-list { flex: 1; overflow-y: auto; }
    .queue-item {
      display: flex; align-items: center; gap: 10px;
      padding: 10px 16px; cursor: pointer; transition: background .15s; border-bottom: 1px solid var(--border);
    }
    .queue-item:hover { background: var(--card); }
    .queue-item.playing { background: rgba(168,85,247,.1); border-left: 3px solid var(--accent); }
    .queue-item img { width: 40px; height: 40px; border-radius: 8px; object-fit: cover; flex-shrink: 0; }
    .qi-info { flex: 1; min-width: 0; }
    .qi-title { font-size: 12px; font-weight: 700; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .qi-artist { font-size: 11px; color: var(--muted); }
    .qi-remove { background: none; border: none; color: var(--muted); cursor: pointer; font-size: 16px; }
    .queue-overlay {
      position: fixed; inset: 0; background: rgba(0,0,0,.5); z-index: 199;
      display: none;
    }
    .queue-overlay.open { display: block; }

    /* Toast */
    #toast {
      position: fixed; bottom: 170px; left: 50%; transform: translateX(-50%) translateY(20px);
      background: var(--card); border: 1px solid var(--border);
      color: var(--text); font-size: 12px; font-weight: 600;
      padding: 8px 18px; border-radius: 30px; z-index: 999;
      opacity: 0; transition: all .3s; white-space: nowrap; pointer-events: none;
    }
    #toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }

    /* Responsive */
    @media (max-width: 480px) {
      .logo span { display: none; }
      #vol-wrap { display: none; }
      .grid { grid-template-columns: repeat(2, 1fr); }
    }
  </style>
</head>
<body>

<!-- HEADER -->
<header>
  <div class="header-inner">
    <div class="logo">Sunofy<span>YT</span></div>
    <div class="mode-tabs">
      <button class="mode-tab active" data-mode="music" onclick="setMode('music')">🎵 Music</button>
      <button class="mode-tab" data-mode="video" onclick="setMode('video')">🎬 Video</button>
    </div>
    <div class="search-wrap">
      <input id="search-input" type="search" placeholder="Search YouTube..." autocomplete="off" />
      <button onclick="triggerSearch()" title="Search">
        <svg width="16" height="16" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2.5">
          <circle cx="11" cy="11" r="8"/><path d="M21 21l-4.35-4.35"/>
        </svg>
      </button>
    </div>
    <button class="ctrl-btn" onclick="toggleQueue()" title="Queue" style="flex-shrink:0">
      <svg width="18" height="18" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
        <path d="M8 6h13M8 12h13M8 18h13M3 6h.01M3 12h.01M3 18h.01"/>
      </svg>
    </button>
  </div>
</header>

<!-- MAIN -->
<main>
  <div class="container">
    <div id="results-container">
      <!-- Home -->
      <div class="empty" id="home-msg">
        <svg width="64" height="64" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
          <path d="M9 18V5l12-2v13"/><circle cx="6" cy="18" r="3"/><circle cx="18" cy="16" r="3"/>
        </svg>
        <h3>Search YouTube Music &amp; Videos</h3>
        <p>Type a song name, artist, or paste a YouTube playlist link</p>
      </div>
    </div>
  </div>
</main>

<!-- QUEUE OVERLAY -->
<div class="queue-overlay" id="queue-overlay" onclick="toggleQueue()"></div>

<!-- QUEUE PANEL -->
<div id="queue-panel">
  <div class="queue-header">
    <h2>Queue (<span id="queue-count">0</span>)</h2>
    <button class="queue-close" onclick="toggleQueue()">
      <svg width="18" height="18" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><path d="M18 6L6 18M6 6l12 12"/></svg>
    </button>
  </div>
  <div class="queue-list" id="queue-list"></div>
</div>

<!-- PLAYER BAR -->
<div id="player-bar">
  <div id="video-panel">
    <iframe id="yt-iframe" src="" allow="autoplay; encrypted-media" allowfullscreen></iframe>
  </div>
  <div class="progress-wrap">
    <input type="range" class="progress-bar" id="progress" min="0" max="100" value="0" step="0.1" />
  </div>
  <div class="time-row">
    <span id="time-current">0:00</span>
    <span id="time-total">0:00</span>
  </div>
  <div class="player-inner">
    <img id="now-thumb" class="now-thumb" src="" alt="" onclick="toggleVideoPanel()" />
    <div class="now-info" onclick="toggleVideoPanel()">
      <div class="now-title" id="now-title">No track</div>
      <div class="now-artist" id="now-artist">—</div>
    </div>
    <div class="player-controls">
      <button class="ctrl-btn" onclick="playPrev()" title="Previous">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor"><path d="M6 6h2v12H6zm3.5 6 8.5 6V6z"/></svg>
      </button>
      <button class="ctrl-btn play-pause" id="play-pause-btn" onclick="togglePlay()" title="Play/Pause">
        <svg id="pp-icon" width="20" height="20" viewBox="0 0 24 24" fill="currentColor">
          <path d="M8 5v14l11-7z"/>
        </svg>
      </button>
      <button class="ctrl-btn" onclick="playNext()" title="Next">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor"><path d="M6 18l8.5-6L6 6v12zM16 6v12h2V6h-2z"/></svg>
      </button>
    </div>
    <div id="vol-wrap">
      <svg width="14" height="14" fill="currentColor" viewBox="0 0 24 24"><path d="M3 9v6h4l5 5V4L7 9H3zm13.5 3c0-1.77-1.02-3.29-2.5-4.03v8.05c1.48-.73 2.5-2.25 2.5-4.02z"/></svg>
      <input type="range" id="volume" min="0" max="1" step="0.02" value="1" oninput="setVolume(this.value)" />
    </div>
    <button class="ctrl-btn" id="shuffle-btn" onclick="toggleShuffle()" title="Shuffle" style="opacity:.5">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <polyline points="16 3 21 3 21 8"/><line x1="4" y1="20" x2="21" y2="3"/>
        <polyline points="21 16 21 21 16 21"/><line x1="15" y1="15" x2="21" y2="21"/>
      </svg>
    </button>
  </div>
</div>

<!-- TOAST -->
<div id="toast"></div>

<!-- HIDDEN AUDIO -->
<audio id="audio-el" preload="none"></audio>

<script>
// ────────────────────────────────────────────────────────────────────────────
// STATE
// ────────────────────────────────────────────────────────────────────────────
let mode = 'music'; // 'music' | 'video'
let queue = [];
let queueIndex = -1;
let isPlaying = false;
let isShuffle = false;
let isDragging = false;
let videoOpen = false;

const audio = document.getElementById('audio-el');
const iframe = document.getElementById('yt-iframe');
const searchInput = document.getElementById('search-input');

// ────────────────────────────────────────────────────────────────────────────
// MODE
// ────────────────────────────────────────────────────────────────────────────
function setMode(m) {
  mode = m;
  document.querySelectorAll('.mode-tab').forEach(t => t.classList.toggle('active', t.dataset.mode === m));
  searchInput.placeholder = m === 'music' ? 'Search YouTube Music...' : 'Search YouTube Videos...';
  if (searchInput.value.trim()) triggerSearch();
}

// ────────────────────────────────────────────────────────────────────────────
// SEARCH
// ────────────────────────────────────────────────────────────────────────────
searchInput.addEventListener('keydown', e => { if (e.key === 'Enter') triggerSearch(); });

let searchDebounce;
searchInput.addEventListener('input', () => {
  clearTimeout(searchDebounce);
  const q = searchInput.value.trim();
  if (!q) { showHome(); return; }
  if (q.length > 2) searchDebounce = setTimeout(triggerSearch, 500);
});

async function triggerSearch() {
  const q = searchInput.value.trim();
  if (!q) return;

  // YouTube playlist URL?
  const plMatch = q.match(/[?&]list=([A-Za-z0-9_-]+)/);
  if (plMatch) {
    await loadPlaylist(plMatch[1]);
    return;
  }

  const filter = mode === 'video' ? 'all' : 'music_songs';
  renderLoading();
  try {
    const res = await fetch(`/api/youtube/search?q=${encodeURIComponent(q)}&filter=${filter}`);
    const data = await res.json();
    const items = data.results || data.items || [];
    if (items.length === 0) { renderEmpty('No results found for "' + q + '"'); return; }
    renderResults(items, `Results for "${q}"`);
  } catch (e) {
    renderEmpty('Failed to search. Is the server running?');
  }
}

async function loadPlaylist(listId) {
  renderLoading('Loading playlist...');
  try {
    const res = await fetch(`/api/youtube/playlist?id=${encodeURIComponent(listId)}`);
    const data = await res.json();
    const items = data.results || data.items || [];
    if (items.length === 0) { renderEmpty('Could not load playlist.'); return; }
    renderResults(items, `Playlist (${items.length} tracks)`);
    toast(`Loaded ${items.length} tracks`);
  } catch (e) {
    renderEmpty('Failed to load playlist.');
  }
}

// ────────────────────────────────────────────────────────────────────────────
// RENDER
// ────────────────────────────────────────────────────────────────────────────
function showHome() {
  document.getElementById('results-container').innerHTML = `
    <div class="empty" id="home-msg">
      <svg width="64" height="64" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
        <path d="M9 18V5l12-2v13"/><circle cx="6" cy="18" r="3"/><circle cx="18" cy="16" r="3"/>
      </svg>
      <h3>Search YouTube Music &amp; Videos</h3>
      <p>Type a song name, artist, or paste a YouTube playlist link</p>
    </div>`;
}

function renderLoading(msg = 'Searching...') {
  document.getElementById('results-container').innerHTML = `
    <div style="text-align:center;padding:40px 0;color:var(--muted);font-size:13px;font-weight:600">
      <div class="spinner"></div>${msg}
    </div>`;
}

function renderEmpty(msg) {
  document.getElementById('results-container').innerHTML = `
    <div class="empty">
      <svg width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
        <circle cx="11" cy="11" r="8"/><path d="M21 21l-4.35-4.35"/>
      </svg>
      <h3>Nothing found</h3><p>${msg}</p>
    </div>`;
}

function renderResults(items, title) {
  const container = document.getElementById('results-container');
  const useGrid = mode === 'video';

  let html = `<div class="results-title">${title}</div>`;
  html += `<div class="${useGrid ? 'grid' : 'grid list'}" id="results-grid">`;

  items.forEach((item, i) => {
    const thumb = item.thumbnail || item.image || `https://i.ytimg.com/vi/${item.videoId || item.id}/hqdefault.jpg`;
    const title = escHtml(item.title || 'Untitled');
    const artist = escHtml(item.artist || item.author || 'YouTube');
    const dur = formatDur(item.lengthSeconds || item.duration || 0);
    const idx = i;

    if (useGrid) {
      html += `
        <div class="card" onclick="playItem(${i}, ${JSON.stringify(items).replace(/\\/g,'\\\\').replace(/"/g,'&quot;')})">
          <div class="thumb-wrap">
            <img src="${thumb}" alt="" loading="lazy" onerror="this.src='https://placehold.co/320x180/111/888?text=YT'" />
            <div class="dur">${dur}</div>
            <div class="play-btn">
              <svg width="40" height="40" viewBox="0 0 24 24" fill="white"><path d="M8 5v14l11-7z"/></svg>
            </div>
          </div>
          <div class="card-info">
            <div class="card-title">${title}</div>
            <div class="card-artist">${artist}</div>
          </div>
        </div>`;
    } else {
      html += `
        <div class="list-card" onclick="playItem(${i}, null)">
          <img class="list-thumb" src="${thumb}" alt="" loading="lazy" onerror="this.src='https://placehold.co/56x56/111/888?text=♪'" />
          <div class="list-info">
            <div class="list-title">${title}</div>
            <div class="list-artist">${artist}</div>
          </div>
          <span class="list-dur">${dur}</span>
          <button class="add-q" onclick="event.stopPropagation();addToQueue(${i})">+ Queue</button>
        </div>`;
    }
  });

  html += '</div>';
  container.innerHTML = html;

  // Store results for play-by-index
  window._lastResults = items;

  html += `
    <div style="margin-top:16px">
      <button onclick="playAllResults()" style="padding:10px 22px;background:var(--accent);color:#fff;border:none;border-radius:12px;font-size:13px;font-weight:700;cursor:pointer;font-family:inherit">
        ▶ Play All
      </button>
      <button onclick="addAllToQueue()" style="padding:10px 18px;background:var(--card);border:1px solid var(--border);color:var(--text);border-radius:12px;font-size:13px;font-weight:700;cursor:pointer;font-family:inherit;margin-left:8px">
        + Add All to Queue
      </button>
    </div>`;

  container.innerHTML = html;
  window._lastResults = items;

  // Re-attach click handlers properly using data attributes
  const cards = container.querySelectorAll('.card, .list-card');
  cards.forEach((card, i) => {
    card.addEventListener('click', (e) => {
      if (e.target.classList.contains('add-q')) return;
      playFromResults(i);
    });
  });
  const addQBtns = container.querySelectorAll('.add-q');
  addQBtns.forEach((btn, i) => {
    btn.addEventListener('click', (e) => { e.stopPropagation(); addToQueueByIndex(i); });
  });
}

function playFromResults(idx) {
  const items = window._lastResults;
  if (!items) return;
  // Replace queue with results starting from this index
  const before = items.slice(0, idx);
  const from = items.slice(idx);
  queue = [...from.map(normalizeItem), ...before.map(normalizeItem)];
  queueIndex = 0;
  playCurrentTrack();
  updateQueueUI();
}

function addToQueueByIndex(idx) {
  const items = window._lastResults;
  if (!items || !items[idx]) return;
  queue.push(normalizeItem(items[idx]));
  updateQueueUI();
  toast('Added to queue');
}

function playItem(i, items) {
  // legacy fallback
  playFromResults(i);
}

function playAllResults() {
  const items = window._lastResults;
  if (!items || items.length === 0) return;
  queue = items.map(normalizeItem);
  queueIndex = 0;
  playCurrentTrack();
  updateQueueUI();
  toast(`Playing ${items.length} tracks`);
}

function addAllToQueue() {
  const items = window._lastResults;
  if (!items) return;
  const added = items.map(normalizeItem);
  queue = [...queue, ...added];
  updateQueueUI();
  toast(`Added ${added.length} to queue`);
}

function normalizeItem(item) {
  return {
    id: item.videoId || item.id,
    title: item.title || 'Untitled',
    artist: item.artist || item.author || 'YouTube',
    thumbnail: item.thumbnail || item.image || `https://i.ytimg.com/vi/${item.videoId||item.id}/hqdefault.jpg`,
    duration: item.lengthSeconds || (typeof item.duration === 'number' ? item.duration : 0),
    streamUrl: item.downloadUrl || `/api/youtube/stream?id=${item.videoId || item.id}`,
    videoId: item.videoId || item.id,
    isVideo: mode === 'video',
  };
}

// ────────────────────────────────────────────────────────────────────────────
// PLAYBACK
// ────────────────────────────────────────────────────────────────────────────
function playCurrentTrack() {
  if (queue.length === 0 || queueIndex < 0) return;
  const track = queue[queueIndex];
  if (!track) return;

  updateNowPlaying(track);
  showPlayerBar();

  if (track.isVideo) {
    // Use YouTube embed for video mode
    audio.pause();
    audio.src = '';
    openVideoPanel(track.videoId);
  } else {
    // Audio stream mode
    closeVideoPanel();
    audio.src = track.streamUrl;
    audio.load();
    audio.play().catch(err => {
      console.warn('Audio play failed, trying embed fallback', err);
      // Fallback to embed
      openVideoPanel(track.videoId, true); // autoplay=1, muted=0
    });
  }
  isPlaying = true;
  updatePlayIcon();
  updateQueueUI();
}

function openVideoPanel(videoId, audioOnly = false) {
  const params = audioOnly
    ? `autoplay=1&controls=0&disablekb=1&playsinline=1&enablejsapi=1`
    : `autoplay=1&controls=1&playsinline=1&enablejsapi=1`;
  iframe.src = `https://www.youtube.com/embed/${videoId}?${params}`;
  document.getElementById('video-panel').classList.add('open');
  videoOpen = true;
}

function closeVideoPanel() {
  iframe.src = '';
  document.getElementById('video-panel').classList.remove('open');
  videoOpen = false;
}

function toggleVideoPanel() {
  const track = queue[queueIndex];
  if (!track) return;
  if (videoOpen) {
    closeVideoPanel();
  } else {
    openVideoPanel(track.videoId, !track.isVideo);
  }
}

function updateNowPlaying(track) {
  document.getElementById('now-thumb').src = track.thumbnail;
  document.getElementById('now-title').textContent = track.title;
  document.getElementById('now-artist').textContent = track.artist;
  document.title = `${track.title} — Sunofy YT`;
  // Media Session
  if ('mediaSession' in navigator) {
    navigator.mediaSession.metadata = new MediaMetadata({
      title: track.title, artist: track.artist,
      artwork: [{ src: track.thumbnail, sizes: '512x512', type: 'image/jpeg' }],
    });
    navigator.mediaSession.setActionHandler('play', () => { audio.play(); isPlaying = true; updatePlayIcon(); });
    navigator.mediaSession.setActionHandler('pause', () => { audio.pause(); isPlaying = false; updatePlayIcon(); });
    navigator.mediaSession.setActionHandler('previoustrack', playPrev);
    navigator.mediaSession.setActionHandler('nexttrack', playNext);
  }
}

function showPlayerBar() {
  document.getElementById('player-bar').classList.add('visible');
}

function togglePlay() {
  if (queue.length === 0) return;
  if (isPlaying) {
    audio.pause();
    if (videoOpen) iframe.contentWindow?.postMessage('{"event":"command","func":"pauseVideo","args":""}', '*');
    isPlaying = false;
  } else {
    if (queue[queueIndex]?.isVideo && videoOpen) {
      iframe.contentWindow?.postMessage('{"event":"command","func":"playVideo","args":""}', '*');
    } else {
      audio.play().catch(() => {});
    }
    isPlaying = true;
  }
  updatePlayIcon();
}

function updatePlayIcon() {
  const icon = document.getElementById('pp-icon');
  icon.innerHTML = isPlaying
    ? '<path d="M6 19h4V5H6v14zm8-14v14h4V5h-4z"/>'  // pause
    : '<path d="M8 5v14l11-7z"/>';                     // play
}

function playNext() {
  if (queue.length === 0) return;
  if (isShuffle) {
    queueIndex = Math.floor(Math.random() * queue.length);
  } else {
    queueIndex = (queueIndex + 1) % queue.length;
  }
  playCurrentTrack();
}

function playPrev() {
  if (queue.length === 0) return;
  if (audio.currentTime > 3) { audio.currentTime = 0; return; }
  queueIndex = (queueIndex - 1 + queue.length) % queue.length;
  playCurrentTrack();
}

function setVolume(v) {
  audio.volume = parseFloat(v);
}

function toggleShuffle() {
  isShuffle = !isShuffle;
  document.getElementById('shuffle-btn').style.opacity = isShuffle ? '1' : '.5';
  toast(isShuffle ? 'Shuffle On' : 'Shuffle Off');
}

// ─── Queue ───
function addToQueue(item) {
  queue.push(typeof item === 'object' ? item : normalizeItem(item));
  updateQueueUI();
}

function updateQueueUI() {
  document.getElementById('queue-count').textContent = queue.length;
  const list = document.getElementById('queue-list');
  if (queue.length === 0) { list.innerHTML = '<div style="padding:24px;text-align:center;color:var(--muted);font-size:13px">Queue is empty</div>'; return; }
  list.innerHTML = queue.map((t, i) => `
    <div class="queue-item ${i === queueIndex ? 'playing' : ''}" data-qi="${i}">
      <img src="${escHtml(t.thumbnail)}" alt="" onerror="this.src='https://placehold.co/40x40/111/888?text=♪'" />
      <div class="qi-info">
        <div class="qi-title">${escHtml(t.title)}</div>
        <div class="qi-artist">${escHtml(t.artist)}</div>
      </div>
      <button class="qi-remove" data-qi-rm="${i}" title="Remove">×</button>
    </div>`).join('');

  list.querySelectorAll('.queue-item').forEach(el => {
    el.addEventListener('click', (e) => {
      if (e.target.classList.contains('qi-remove') || e.target.dataset.qiRm !== undefined) return;
      queueIndex = parseInt(el.dataset.qi);
      playCurrentTrack();
    });
  });
  list.querySelectorAll('[data-qi-rm]').forEach(btn => {
    btn.addEventListener('click', e => {
      e.stopPropagation();
      const i = parseInt(btn.dataset.qiRm);
      queue.splice(i, 1);
      if (queueIndex >= i && queueIndex > 0) queueIndex--;
      updateQueueUI();
    });
  });
}

function toggleQueue() {
  document.getElementById('queue-panel').classList.toggle('open');
  document.getElementById('queue-overlay').classList.toggle('open');
}

// ─── Progress ───
audio.addEventListener('timeupdate', () => {
  if (isDragging || !audio.duration) return;
  const pct = (audio.currentTime / audio.duration) * 100;
  const prog = document.getElementById('progress');
  prog.value = pct;
  prog.style.background = `linear-gradient(to right, var(--accent) ${pct}%, var(--border) ${pct}%)`;
  document.getElementById('time-current').textContent = formatDur(Math.floor(audio.currentTime));
  document.getElementById('time-total').textContent = formatDur(Math.floor(audio.duration));
});
audio.addEventListener('ended', playNext);
audio.addEventListener('play', () => { isPlaying = true; updatePlayIcon(); });
audio.addEventListener('pause', () => { isPlaying = false; updatePlayIcon(); });

const prog = document.getElementById('progress');
prog.addEventListener('mousedown', () => isDragging = true);
prog.addEventListener('touchstart', () => isDragging = true);
prog.addEventListener('input', () => {
  if (!audio.duration) return;
  const t = (prog.value / 100) * audio.duration;
  document.getElementById('time-current').textContent = formatDur(Math.floor(t));
  prog.style.background = `linear-gradient(to right, var(--accent) ${prog.value}%, var(--border) ${prog.value}%)`;
});
prog.addEventListener('change', () => {
  isDragging = false;
  if (!audio.duration) return;
  audio.currentTime = (prog.value / 100) * audio.duration;
});

// Back button — close panels before exiting
window.addEventListener('popstate', () => {
  if (document.getElementById('queue-panel').classList.contains('open')) {
    toggleQueue();
    history.pushState(null, '', location.href);
  } else if (videoOpen) {
    closeVideoPanel();
    history.pushState(null, '', location.href);
  }
});
history.pushState(null, '', location.href);

// ────────────────────────────────────────────────────────────────────────────
// HELPERS
// ────────────────────────────────────────────────────────────────────────────
function formatDur(secs) {
  if (!secs || isNaN(secs)) return '—';
  secs = Math.floor(typeof secs === 'string' ? parseDurStr(secs) : secs);
  const m = Math.floor(secs / 60);
  const s = secs % 60;
  return `${m}:${s.toString().padStart(2, '0')}`;
}
function parseDurStr(str) {
  if (typeof str === 'number') return str;
  const parts = str.split(':').map(Number);
  if (parts.length === 3) return parts[0]*3600 + parts[1]*60 + parts[2];
  if (parts.length === 2) return parts[0]*60 + parts[1];
  return 0;
}
function escHtml(str) {
  return String(str).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}
let toastTimer;
function toast(msg) {
  const el = document.getElementById('toast');
  el.textContent = msg;
  el.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => el.classList.remove('show'), 2500);
}

// Init
updateQueueUI();
</script>
</body>
</html>
