<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sunofy - Music Streaming & Sync Party</title>
    <!-- Tailwind CSS for utility classes -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        sunofy: {
                            bg: '#0a0a0c',
                            card: '#121216',
                            border: '#22222c',
                            accent: '#1db954',
                            hover: '#1ed760',
                            muted: '#a7a7a7'
                        }
                    }
                }
            }
        }
    </script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700&display=swap');
        
        * {
            font-family: 'Plus Jakarta Sans', sans-serif;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background-color: #0a0a0c;
            color: #ffffff;
            overflow-x: hidden;
        }

        /* Custom Scrollbar */
        ::-webkit-scrollbar {
            width: 4px;
            height: 4px;
        }
        ::-webkit-scrollbar-track {
            background: #0a0a0c;
        }
        ::-webkit-scrollbar-thumb {
            background: #22222c;
            border-radius: 4px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: #1db954;
        }

        /* Glassmorphism */
        .glass {
            background: rgba(18, 18, 22, 0.75);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.08);
        }

        .glass-player {
            background: rgba(18, 18, 22, 0.90);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border-top: 1px solid rgba(255, 255, 255, 0.08);
        }

        /* Animations */
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(6px); }
            to { opacity: 1; transform: translateY(0); }
        }

        @keyframes pulseSkeleton {
            0% { background-color: #1a1a24; }
            50% { background-color: #2a2a38; }
            100% { background-color: #1a1a24; }
        }

        .animate-fade {
            animation: fadeIn 0.3s cubic-bezier(0.16, 1, 0.3, 1) forwards;
        }

        .skeleton {
            animation: pulseSkeleton 1.5s infinite ease-in-out;
        }

        /* Utilities */
        .no-scrollbar::-webkit-scrollbar {
            display: none;
        }
        .no-scrollbar {
            -ms-overflow-style: none;
            scrollbar-width: none;
        }

        @keyframes rotate-vinyl {
            from { transform: rotate(0deg); }
            to { transform: rotate(360deg); }
        }
        .spinning-art {
            animation: rotate-vinyl 15s linear infinite;
            animation-play-state: paused;
        }
        .spinning-art.playing {
            animation-play-state: running;
        }
    </style>
</head>
<body class="bg-sunofy-bg text-white antialiased selection:bg-sunofy-accent selection:text-black">
    <div id="app" class="flex flex-col h-screen max-w-md mx-auto relative overflow-hidden shadow-2xl border-x border-sunofy-border">
    </div>
</body>
</html>
